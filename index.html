<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://stream.mux.com" crossorigin />
    <link rel="dns-prefetch" href="https://stream.mux.com" />
    <link rel="preload" as="image" href="/images/hero-video-poster.webp" fetchpriority="low" />
    <link
      rel="preload"
      href="/fonts/absans/Absans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bigilla/Bigilla.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%HTML_DESCRIPTION%" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F0EDE4" />
    <link rel="canonical" href="%HTML_CANONICAL%" />
    <title>%HTML_TITLE%</title>
    <style>
      /* Primo paint: solo crema — niente flash del frame hero */
      html,
      body {
        margin: 0;
        background: #f0ede4;
      }
      #initial-hero-poster {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #f0ede4;
        pointer-events: none;
      }
    </style>

    <!-- Open Graph / social preview (letti dai crawler senza JavaScript) -->
    <meta property="og:site_name" content="%OG_SITE_NAME%" />
    <meta property="og:title" content="%HTML_TITLE%" />
    <meta property="og:description" content="%HTML_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%HTML_CANONICAL%" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:alt" content="Residence Le Vele — appartamenti vacanze a Stintino, Sardegna" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%HTML_TITLE%" />
    <meta name="twitter:description" content="%HTML_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
  </head>
  <body>
    <!-- Solo fondo crema pre-React (niente frame: evita flash prima dell'intro) -->
    <div id="initial-hero-poster" aria-hidden="true"></div>
    <script>
      try {
        var locale = localStorage.getItem('lv-site-locale');
        if (locale) document.documentElement.lang = locale;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
